<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SwissKnife Control Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20260220a" onerror="this.onerror=null;this.href='style.css';">
</head>
<body>
  <div class="background-grid" aria-hidden="true"></div>
  <div class="background-glow background-glow-a" aria-hidden="true"></div>
  <div class="background-glow background-glow-b" aria-hidden="true"></div>

  <section id="introGate" class="intro-gate">
    <canvas id="matrixCanvas" class="matrix-canvas" aria-hidden="true"></canvas>
    <div class="intro-content">
      <img id="introLogo" class="intro-logo" src="/static/intro-logo.png" alt="SwissKnife logo" onerror="this.hidden=true;document.getElementById('introLogoFallback').hidden=false;">
      <div id="introLogoFallback" class="intro-logo-fallback" hidden>SWISSKNIFE</div>
      <form id="introLoginForm" class="intro-form" autocomplete="off">
        <label for="introPasswordInput">pass</label>
        <input id="introPasswordInput" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button id="introLoginBtn" type="submit" class="primary">Unlock</button>
      </form>
      <p id="introHint" class="hint"></p>
    </div>
  </section>

  <main id="appShell" class="app-shell" hidden>
    <header class="topbar panel">
      <div class="brand-wrap">
        <div class="brand-badge">SK</div>
        <div>
          <h1>SwissKnife Control Matrix</h1>
          <p>Click-first mission control for recon and attack workflows.</p>
        </div>
      </div>

      <div class="topbar-controls">
        <div class="settings-wrap">
          <button id="settingsToggleBtn" type="button" class="gear-btn" aria-label="Settings">&#9881;</button>
          <div id="settingsMenu" class="settings-menu" hidden>
            <button id="openPasswordChangeBtn" type="button">Change password</button>
            <div id="passwordChangePanel" class="settings-inline" hidden>
              <input id="newPasswordInput" type="password" autocomplete="new-password" placeholder="New password">
              <button id="changePasswordBtn" type="button" class="primary">Save</button>
            </div>
            <button id="turnOffBtn" type="button" class="danger">Turn off</button>
          </div>
        </div>
        <p id="authHint" class="hint"></p>
      </div>
    </header>

    <section class="layout">
      <aside class="panel menu-panel">
        <div class="panel-head">
          <h2>Main Menu</h2>
          <button id="refreshMenuBtn" type="button">Reload</button>
        </div>
        <nav id="mainMenu" class="menu-list"></nav>
        <div class="panel-foot">
          <span class="pill">Web UI port: 8000</span>
        </div>
      </aside>

      <section class="panel center-panel">
        <div class="panel-head">
          <div>
            <h2 id="sectionTitle">Section</h2>
            <p id="sectionDescription" class="section-description"></p>
          </div>
          <div class="panel-actions">
            <input id="globalArgsInput" type="text" placeholder="Advanced args (optional)">
          </div>
        </div>

        <div id="sectionBody" class="section-body"></div>

        <div class="panel-head second-head">
          <h2>Tasks</h2>
          <div class="panel-actions">
            <span id="activeTaskChip" class="pill">No task selected</span>
            <button id="stopTaskBtn" type="button" class="danger">Stop</button>
            <button id="refreshTasksBtn" type="button">Refresh</button>
          </div>
        </div>
        <ul id="tasksList" class="tasks-list"></ul>

        <div class="panel-head second-head">
          <h2>Recon Results</h2>
        </div>
        <div id="resultsView" class="results-view"></div>
      </section>
    </section>
  </main>

  <script src="/static/app.js?v=20260220a" onerror="this.onerror=null;this.src='app.js';"></script>
</body>
</html>
